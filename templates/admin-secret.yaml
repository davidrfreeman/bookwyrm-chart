{{- if not .Values.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookwyrm.adminSecretName" . | quote }}
  labels:
    {{- include "bookwyrm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.admin.passwordSecretKey | quote }}: {{ required "admin.password is required" .Values.admin.password | quote }}
{{- end }}
