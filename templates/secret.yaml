{{- if not .Values.existingSecret }}
{{- $data := dict
  "SECRET_KEY" .Values.secret.secretKey
  "POSTGRES_PASSWORD" .Values.secret.postgresPassword
  "REDIS_BROKER_PASSWORD" .Values.secret.redisBrokerPassword
  "REDIS_ACTIVITY_PASSWORD" .Values.secret.redisActivityPassword
  "EMAIL_HOST_PASSWORD" .Values.secret.emailPassword
  "AWS_ACCESS_KEY_ID" .Values.secret.s3AccessKeyId
  "AWS_SECRET_ACCESS_KEY" .Values.secret.s3SecretAccessKey
}}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $_ := set $data "POSTGRES_PASSWORD" (required "postgresql.auth.password must be set when creating bundled PostgreSQL credentials" .Values.postgresql.auth.password) }}
{{- end }}
{{- if and .Values.redisBroker.enabled (not .Values.redisBroker.auth.existingSecret) }}
{{- $_ := set $data "REDIS_BROKER_PASSWORD" (required "redisBroker.auth.password must be set when creating bundled Redis credentials" .Values.redisBroker.auth.password) }}
{{- end }}
{{- if and .Values.redisActivity.enabled (not .Values.redisActivity.auth.existingSecret) }}
{{- $_ := set $data "REDIS_ACTIVITY_PASSWORD" (required "redisActivity.auth.password must be set when creating bundled Redis credentials" .Values.redisActivity.auth.password) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookwyrm.secretName" . | quote }}
  labels:
    {{- include "bookwyrm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
